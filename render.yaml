services:
  - type: web
    name: elevator-digital-twin
    runtime: python
    buildCommand: "pip install -r requirements.txt && apt-get update -qq && apt-get install -y -qq fonts-noto-cjk"
    startCommand: "gunicorn webapp:app --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: AGNES_API_KEY
        sync: false
